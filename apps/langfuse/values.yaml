langfuse:
  ingress:
    enabled: true
    className: traefik
    hosts:
      - host: "langfuse.uaiso.lan"
        paths:
          - path: /
            pathType: ImplementationSpecific
  # migrations killed before finish with slow disk io
  web:
    livenessProbe:
      initialDelaySeconds: 600
    readinessProbe:
      initialDelaySeconds: 600
