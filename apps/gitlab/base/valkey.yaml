apiVersion: v1
kind: Namespace
metadata:
  name: gitlab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  namespace: gitlab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: valkey
  template:
    metadata:
      labels:
        app: valkey
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:9.0.6-alpine3.24
          ports:
            - containerPort: 6379
              protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: gitlab
spec:
  selector:
    app: valkey
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
  type: ClusterIP
