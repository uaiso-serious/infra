certmanager-issuer:
  email: me@uaiso.lan
global:
  edition: ce
  hosts:
    domain: uaiso.lan
    externalIp: 127.0.0.1
    https: false
  initialRootPassword:
    secret: gitlab-initial-root-passwd
    key: password
  psql:
    host: postgresql.gitlab.svc.cluster.local
    username: postgres
    database: gitlab
    password:
      secret: postgresql
      key: password
  redis:
    auth:
      enabled: false
    host: valkey.gitlab.svc.cluster.local
  appConfig:
    object_store:
      connection:
        secret: gitlab-object-storage
        key: connection
      enabled: true
      proxy_download: false
    artifacts:
      enabled: true
      bucket: gitlab-artifacts-storage
    lfs:
      enabled: true
      bucket: gitlab-lfs-storage
    packages:
      enabled: true
      bucket: gitlab-packages-storage
    backups:
      bucket: gitlab-backup-storage
      tmpBucket: gitlab-tmp-storage
    uploads:
      enabled: true
      bucket: gitlab-uploads-storage
  gatewayApi:
    enabled: false
    installEnvoy: false
  registry:
    enabled: true
    bucket: gitlab-registry-storage
  runner:
    registrationToken:
      secret: gitlab-runner-secret
  ingress:
    enabled: true
    provider: traefik
    class: traefik
    tls:
      enabled: false
    annotations:
      traefik.ingress.kubernetes.io/router.tls: "false"
      traefik.ingress.kubernetes.io/router.entrypoints: web, websecure

gitlab:
  gitlab-shell:
    enabled: false
  webservice:
    minReplicas: 1
  kas:
    minReplicas: 1
  toolbox:
    backups:
      objectStorage:
        config:
          secret: s3cmd-config
          key: s3cfg

prometheus:
  install: false
gitlab-runner:
  install: true
  runners:
    privileged: true
    config: |
      [[runners]]
        request_concurrency = 2
        [runners.kubernetes]
        privileged = true
        image = "ubuntu:26.04"
registry:
  enabled: true
  storage:
    secret: registry-storage
    key: config
installCertmanager: false
